x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *service-logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paper_online}
      POSTGRES_USER: ${POSTGRES_USER:-paper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paper} -d ${POSTGRES_DB:-paper_online}"]
      interval: 10s
      timeout: 5s
      retries: 10

  typesense:
    logging: *service-logging
    image: typesense/typesense:30.2
    restart: unless-stopped
    command:
      - "--data-dir=/data"
      - "--api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}"
    ports:
      - "127.0.0.1:${TYPESENSE_HTTP_PORT:-8108}:8108"
    volumes:
      - typesense_data:/data

  pdf2zh:
    logging: *service-logging
    build:
      context: .
      dockerfile: docker/pdf2zh/Dockerfile
    restart: unless-stopped
    environment:
      # 与 app 一致：网关/模型站可能需要走本机代理才能访问
      HTTP_PROXY: ${OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${OUTBOUND_PROXY_URL:-}
      ALL_PROXY: ${OUTBOUND_PROXY_URL:-}
      NO_PROXY: ${OUTBOUND_NO_PROXY:-localhost,127.0.0.1,::1,postgres,typesense,app,caddy,sub2api,pdf2zh}
      http_proxy: ${OUTBOUND_PROXY_URL:-}
      https_proxy: ${OUTBOUND_PROXY_URL:-}
      all_proxy: ${OUTBOUND_PROXY_URL:-}
      no_proxy: ${OUTBOUND_NO_PROXY:-localhost,127.0.0.1,::1,postgres,typesense,app,caddy,sub2api,pdf2zh}
      # Redis 只做结果缓存：内存上限 + LRU 淘汰；超过就由 app 侧标记成 expired
      PDF2ZH_REDIS_MAXMEMORY: ${PDF2ZH_REDIS_MAXMEMORY:-512mb}
      # celery worker 并发，单篇翻译内部已按 thread 并行调 LLM
      PDF2ZH_CELERY_CONCURRENCY: ${PDF2ZH_CELERY_CONCURRENCY:-1}
    # 不给 pdf2zh 挂持久卷：翻译产物只放内存里的 Redis，模型与字体在镜像构建
    # 时就烤进镜像层，翻译记忆（sqlite）由 entrypoint 定期清理，这样服务器磁盘
    # 上不会随翻译篇数增长。
    healthcheck:
      # 检查 Redis 应答 + Flask 可连 + celery worker 进程存活，见 healthcheck.sh
      test: ["CMD", "pdf2zh-healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  app:
    logging: *service-logging
    # 服务器上这个标签必须来自 release 的 .paper-insight-image（deploy-release.sh 会
    # 把它 export 成 PAPER_INSIGHT_IMAGE）；本地开发才用下面的默认名。
    #
    # 这里默认值的选择有一个不显眼的坑：漏传 PAPER_INSIGHT_IMAGE 时 compose 不会
    # 报错，而是静默用本地那个 paper-insight-app 镜像——机器上如果正好有个几周前手工
    # build 的同名镜像，`docker compose up -d app` 就会把线上 app 静默换成几周前的
    # 版本。2026-09-18 实际发生过一次：换成旧镜像后日志里连 Typesense 都没有，
    # 搜索从 0.05s 退回 5.3s 的 PG 全表扫描，而容器状态一直是 healthy。
    # 所以手工重建 app 时必须写成：
    #   PAPER_INSIGHT_IMAGE=$(cat /opt/paper-insight/current/.paper-insight-image) \
    #     docker compose ... up -d --no-deps --no-build app
    image: ${PAPER_INSIGHT_IMAGE:-paper-insight-app}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_started
      pdf2zh:
        condition: service_started
    environment:
      TYPESENSE_ENABLED: "true"
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_EMBEDDING_MODEL: ${TYPESENSE_EMBEDDING_MODEL:-ts/multilingual-e5-small}
      TYPESENSE_SEMANTIC_SEARCH_ENABLED: ${TYPESENSE_SEMANTIC_SEARCH_ENABLED:-true}
      TYPESENSE_TIMEOUT_SECONDS: ${TYPESENSE_TIMEOUT_SECONDS:-10}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      # PDF 翻译（pdf2zh）走 OpenAI 兼容网关时的凭据；config.yaml 里
      # service 设为 openai:<模型名> 时由 app 随每次请求转给 pdf2zh 容器
      PDF_TRANSLATION_OPENAI_BASE_URL: ${PDF_TRANSLATION_OPENAI_BASE_URL:-}
      PDF_TRANSLATION_OPENAI_API_KEY: ${PDF_TRANSLATION_OPENAI_API_KEY:-}
      PDF_TRANSLATION_OPENAI_MODEL: ${PDF_TRANSLATION_OPENAI_MODEL:-}
      HTTP_PROXY: ${OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${OUTBOUND_PROXY_URL:-}
      ALL_PROXY: ${OUTBOUND_PROXY_URL:-}
      NO_PROXY: ${OUTBOUND_NO_PROXY:-localhost,127.0.0.1,::1,postgres,typesense,app,caddy,sub2api,pdf2zh}
      http_proxy: ${OUTBOUND_PROXY_URL:-}
      https_proxy: ${OUTBOUND_PROXY_URL:-}
      all_proxy: ${OUTBOUND_PROXY_URL:-}
      no_proxy: ${OUTBOUND_NO_PROXY:-localhost,127.0.0.1,::1,postgres,typesense,app,caddy,sub2api,pdf2zh}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  app_data:
  typesense_data:
