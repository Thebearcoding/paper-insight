services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paper_online}
      POSTGRES_USER: ${POSTGRES_USER:-paper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paper} -d ${POSTGRES_DB:-paper_online}"]
      interval: 10s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    command:
      - "--data-dir=/data"
      - "--api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}"
    ports:
      - "127.0.0.1:${TYPESENSE_HTTP_PORT:-8108}:8108"
    volumes:
      - typesense_data:/data

  app:
    image: ${PAPER_INSIGHT_IMAGE:-paper-insight-app}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_started
    environment:
      TYPESENSE_ENABLED: "true"
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  app_data:
  typesense_data:
