services:
  postgres:
    mem_limit: 768m
    cpus: 0.75

  pdf2zh:
    # doclayout ONNX 模型按需在 task 子进程里建、不常驻，Flask 是 worker fork
    # 出来的子进程（共享那份 import 堆）；Redis 另占 PDF2ZH_REDIS_MAXMEMORY
    # （默认 512mb）。翻译进行时 task 子进程峰值最高，上限调低容易 OOM 杀容器
    # （个人 overlay 用 768m 就是按单页翻译实测 643MB 峰值给的）。
    mem_limit: 1536m
    cpus: 1.25
    stop_grace_period: 30s

  app:
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 30s
    networks:
      - default
      - sub2api

networks:
  sub2api:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:-sub2api-deploy_sub2api-network}
