services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100

  app:
    build:
      args:
        DOCKERHUB_PREFIX: ${DOCKERHUB_PREFIX:-}
        PYPI_FILES_MIRROR: ${PYPI_FILES_MIRROR:-}
    mem_limit: 1152m
    cpus: 1.25
    pids_limit: 256

  pdf2zh:
    # 2GB 小机器：doclayout ONNX 模型常驻 ~300MB，PyMuPDF 逐页渲染图像另占
    # 一部分，Redis 结果缓存由 PDF2ZH_REDIS_MAXMEMORY 限制。上限设太高会把
    # app/postgres 挤到 OOM，设太低翻译会被杀掉——翻译被 OOM 时优先调小
    # PDF2ZH_REDIS_MAXMEMORY。
    mem_limit: 900m
    cpus: 0.75
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      # 结果缓存在内存里，小机器按 256MB 起步（base compose 的默认值是 512mb）
      PDF2ZH_REDIS_MAXMEMORY: ${PDF2ZH_REDIS_MAXMEMORY:-256mb}

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PAPER_DOMAIN: ${PAPER_DOMAIN:?PAPER_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/personal/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100

volumes:
  caddy_data:
  caddy_config:
