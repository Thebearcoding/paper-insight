services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100

  typesense:
    # base compose 里 typesense 没有任何上限，是唯一能无限吃内存的服务。实测它
    # 随索引重建涨到过约 231MB（匿名 60MB + 换出 171MB）。给上限的意义不是省内存，
    # 而是把"某个服务失控"的后果限制在它自己：撞上限只会被 cgroup 杀掉并重启
    # （重建索引），而它在 1.8GB 机器上把整机拖进 global OOM 时，被杀的是随机
    # 进程——实测那次连杀的就是 pdf2zh 的 python。
    mem_limit: 512m

  app:
    build:
      args:
        DOCKERHUB_PREFIX: ${DOCKERHUB_PREFIX:-}
        PYPI_FILES_MIRROR: ${PYPI_FILES_MIRROR:-}
    mem_limit: 1152m
    cpus: 1.25
    pids_limit: 256

  pdf2zh:
    build:
      # 国内服务器构建这个镜像时打开：apt + pip 走镜像源，doclayout 模型走
      # hf-mirror。留空则与改动前完全一致（GitHub Actions 的构建校验就是留空跑的）。
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-}
        HF_ENDPOINT: ${HF_ENDPOINT:-}
    # 2GB 小机器：doclayout ONNX 模型常驻 ~300MB，PyMuPDF 逐页渲染图像另占
    # 一部分，Redis 结果缓存由 PDF2ZH_REDIS_MAXMEMORY 限制。上限设太高会把
    # app/postgres 挤到 OOM，设太低翻译会被杀掉——翻译被 OOM 时优先调小
    # PDF2ZH_REDIS_MAXMEMORY。
    #
    # 注意 mem_limit 之和（postgres 384m + typesense 512m + app 1152m + pdf2zh
    # 900m + caddy 128m ≈ 3.1GB）超过机器实际内存（1.87GB），属于超配：
    # mem_limit 是上限而不是预留，平时靠各容器不会同时吃满才跑得动。真正的稳态
    # 占用要小得多（实测全部容器匿名内存合计约 410MB），但超配意味着这里的上限
    # 只是"单个服务能失控到什么程度"，不是"总和不会超"。如果深度分析和翻译并发
    # 时出现容器被 OOM 杀掉，先降 PDF2ZH_REDIS_MAXMEMORY 或
    # PDF2ZH_CELERY_CONCURRENCY，再考虑调低 app 的 mem_limit。
    mem_limit: 900m
    cpus: 0.75
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      # 结果缓存在内存里，小机器按 256MB 起步（base compose 的默认值是 512mb）
      PDF2ZH_REDIS_MAXMEMORY: ${PDF2ZH_REDIS_MAXMEMORY:-256mb}

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PAPER_DOMAIN: ${PAPER_DOMAIN:?PAPER_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/personal/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100

volumes:
  caddy_data:
  caddy_config:
