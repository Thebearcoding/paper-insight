# 2 核小内存主机配置。上限合计 2064 MiB，尚未计入系统、Docker 和构建进程。
# mem_limit 不是预留，也不能保证多个服务同时增长时不会发生整机 OOM。
# 保留功能和现有限制；调整前验证真实语义索引、翻译与部署峰值。详见部署 README。
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      # 在 0.5 CPU 配额下避免额外并行 worker 和逐操作 work_mem 叠加。
      # autovacuum 保持启用；effective_cache_size 只是规划器估计，不是内存分配。
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - jit=off
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100

  typesense:
    # 历史 48446 篇索引的测量未启用 embedding，不能用于证明语义索引够用。
    # 重建会同时保留旧、新索引；继续压低上限可能造成索引加载或重建失败。
    mem_limit: 512m
    # 仅在宿主机有 swap 且内核支持此设置时有效，不能替代物理内存预算。
    mem_swappiness: 10

  app:
    build:
      args:
        DOCKERHUB_PREFIX: ${DOCKERHUB_PREFIX:-}
        PYPI_FILES_MIRROR: ${PYPI_FILES_MIRROR:-}
    # 索引重建按批读取；搜索缓存另有容量限制，但 PDF/图表处理仍需峰值验证。
    mem_limit: 320m
    cpus: 1.25
    pids_limit: 256

  pdf2zh:
    build:
      # 可选国内镜像源；留空沿用国际源，不改变依赖版本。
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-}
        HF_ENDPOINT: ${HF_ENDPOINT:-}
    # 版面模型在翻译子进程内延迟加载，每个任务后回收子进程。
    # 此上限同时覆盖 worker、Flask、模型、PDF 工作集及 Redis；空闲用量不足以验收。
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      # Redis 的结果缓存计入容器总内存，不能直接沿用 base 的 512mb 默认值。
      PDF2ZH_REDIS_MAXMEMORY: ${PDF2ZH_REDIS_MAXMEMORY:-128mb}
      # 限制支持这些变量的数值库线程；不控制 ONNX Runtime 线程池或 LLM 请求并发。
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PAPER_DOMAIN: ${PAPER_DOMAIN:?PAPER_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/personal/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 80m
    cpus: 0.25
    pids_limit: 100

volumes:
  caddy_data:
  caddy_config:
